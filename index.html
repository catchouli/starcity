<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Starcity</title>
    <link data-trunk rel="rust" data-wasm-opt="3" data-initializer="loader.mjs" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #008080; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }

      /* Win95-style loading dialog, shown until the app starts. */
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        font: 13px Tahoma, "MS Sans Serif", system-ui, sans-serif; color: #000;
      }
      .window {
        width: min(340px, calc(100vw - 32px)); background: #c0c0c0; padding: 3px;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
      }
      .title {
        background: linear-gradient(90deg, #000080, #1084d0); color: #fff;
        font-weight: bold; padding: 3px 5px;
      }
      .body { padding: 14px 10px 12px; }
      #loading-label { margin: 0 0 10px; min-height: 1em; }
      .progress {
        height: 20px; padding: 2px; background: #fff; display: flex; gap: 2px; box-sizing: border-box;
        box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      }
      #loading-bar { display: flex; gap: 2px; padding: 1px; }
      #loading-bar i { width: 10px; height: 12px; background: #000080; }
    </style>
  </head>
  <body>
    <canvas id="starcity"></canvas>
    <div id="loading">
      <div class="window">
        <div class="title">Starcity</div>
        <div class="body">
          <p id="loading-label">Loading…</p>
          <div class="progress"><div id="loading-bar"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
