[package]
name = "starcity"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
glam = "0.34.1"
log = "0.4.34"
noise = "0.9.0"
png = "0.18.1"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.79"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Dependencies (wgpu, naga, egui...) dominate the wasm size but not the hot
# loops, so optimise them for size and keep our own code at full speed.
[profile.release.package."*"]
opt-level = "s"

# Terrain generation and meshing are hot loops; keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1
