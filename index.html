<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Starcity</title>
    <link data-trunk rel="rust" data-wasm-opt="3" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8cb3d9; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        font: 16px system-ui, sans-serif; color: #1c2a38; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="starcity"></canvas>
    <div id="loading"><p>Loading Starcity…</p></div>
  </body>
</html>
